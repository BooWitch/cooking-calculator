<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 做菜规划计算器</title>
<style>
:root{--p:#9b87f5;--b:#fdfcfb;--c:#fff;--t:#4a4a4a;--s:#8b8b8b;--d:#ef4444;--ok:#10b981}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#fdfcfb,#f4effa);color:var(--t);padding:20px 15px;line-height:1.6;min-height:100vh}
.container{max-width:800px;margin:0 auto}
h1{font-size:24px;text-align:center;color:var(--p);margin-bottom:20px}
h2{font-size:16px;margin-bottom:12px}
.card{background:var(--c);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(155,135,245,.08);border:1px solid #f3effa}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;color:var(--s);font-weight:bold}
input,select{padding:10px;border:2px solid #eaeaea;border-radius:10px;font-size:14px;outline:none;background:#fafafa;color:var(--t);width:100%}
input:focus,select:focus{border-color:var(--p);background:#fff}
input::placeholder{color:#d1d1d1;font-weight:normal}
button{background:linear-gradient(135deg,#9b87f5,#8b75ed);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;width:100%;margin-top:10px}
.recipe-item{background:#fafafa;border:1px solid #f0f0f0;border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.recipe-title{font-weight:bold;font-size:15px;display:flex;align-items:center;gap:6px}
.ing-tag{background:#f0f4ff;color:#5a75d8;font-size:12px;padding:2px 6px;border-radius:4px;margin-right:4px}
.star-btn{background:none;color:#dcdcdc;font-size:18px;padding:0;width:auto;margin:0;border:none;cursor:pointer}
.star-btn.active{color:#ffb703}
.qty-input{width:70px;text-align:center;padding:6px;font-weight:bold;color:var(--p)}
.inv-item{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid #f0f0f0;border-radius:12px;background:#fafafa;margin-bottom:8px}
.inv-name{font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
.tag{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:bold}
.tag-land{background:#e8f8f5;color:#0abde3}.tag-fish{background:#e3f2fd;color:#0984e3}.tag-limit{background:#fff3cd;color:#d63031}.tag-none{background:#f1f2f6;color:#747d8c}
.inv-inputs{display:flex;gap:8px}
.inv-inputs input{flex:1;text-align:center;padding:8px;border-radius:8px;border:1px solid #eaeaea;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #f0f0f0}
th{color:var(--s);background:#fafafa}
.alarm-danger{color:var(--d);font-weight:bold}.alarm-safe{color:var(--ok);font-weight:bold}
.detail-toggle{color:var(--p);font-weight:bold;margin-top:15px;display:inline-block;border-bottom:2px dashed #dcdcdc;cursor:pointer}
.detail-box{display:none;margin-top:10px;background:#fafafa;padding:12px;border-radius:10px;font-size:13px}
</style>
</head><body>
<div class="container">
  <h1>🍱 做菜规划计算器</h1>
  <div class="card">
    <h2>⚙️ 基础设置 (输入即保存)</h2>
    <div class="grid">
      <div class="field"><label>周期</label><select id="time_mode" oninput="saveData()"><option value="30">按月 (30天)</option><option value="7">按周 (7天)</option></select></div>
      <div class="field"><label>农场地块 (上限12)</label><input type="number" id="plots" value="12" oninput="this.value=this.value.replace(/[^0-9]/g,'');saveData()"></div>
      <div class="field"><label>每块地收获</label><input type="number" id="yieldPerPlot" value="15" oninput="this.value=this.value.replace(/[^0-9]/g,'');saveData()"></div>
      <div class="field"><label>渔场块数 (上限6)</label><input type="number" id="fishPlots" value="6" oninput="this.value=this.value.replace(/[^0-9]/g,'');saveData()"></div>
      <div class="field"><label>每块渔场收获</label><input type="number" id="fishYield" value="15" oninput="this.value=this.value.replace(/[^0-9]/g,'');saveData()"></div>
      <div class="field"><label>多余土地种什么？</label><select id="extraCrop" oninput="saveData()"><option value="">不种</option><option value="冬笋">冬笋(65)</option><option value="红玫瑰">红玫瑰(10)</option><option value="白玫瑰">白玫瑰(20)</option><option value="蓝玫瑰">蓝玫瑰(100)</option></select></div>
      <div class="field"><label>多余渔场养什么？</label><select id="extraFish" oninput="saveData()"><option value="">不养</option><option value="金鱼">金鱼(15)</option></select></div>
    </div>
  </div>
  <div class="card">
    <h2>📖 菜谱与目标份数</h2>
    <div id="recipeList"></div>
    <button onclick="document.getElementById('addForm').style.display='block'" style="background:#fafafa;color:#8b8b8b;border:2px dashed #e0e0e0;margin-top:10px">➕ 添加自定义菜谱</button>
    <div id="addForm" style="display:none;margin-top:15px;padding:15px;background:#fafafa;border-radius:10px">
      <div class="field" style="margin-bottom:10px"><label>菜谱名称</label><input type="text" id="newRecipeName" placeholder="如：豪华月饼"></div>
      <div class="field" style="margin-bottom:10px"><label>配方(如:糖2,猪肉1)</label><input type="text" id="newRecipeItems"></div>
      <div style="display:flex;gap:10px"><button onclick="addRecipe()">确认</button><button onclick="document.getElementById('addForm').style.display='none'" style="background:#e0e0e0;color:#8b8b8b">取消</button></div>
    </div>
  </div>
  <div class="card">
    <h2>🧺 食材与库存</h2>
    <div id="inventoryList"></div>
  </div>
  <button onclick="calculate()">✨ 计算缺口与收益</button>
  <div class="card" id="results" style="display:none;margin-top:20px">
    <h2>📊 计算结果</h2>
    <div id="resContent"></div>
    <button onclick="copyResult()" style="margin-top:15px;background:#f1f5f9;color:#475569;box-shadow:none">📋 一键复制结果</button>
    <div class="detail-toggle" onclick="document.getElementById('costDetails').style.display=document.getElementById('costDetails').style.display==='block'?'none':'block'">🔍 查看成本详情</div>
    <div id="costDetails" class="detail-box"></div>
  </div>
</div><script>
const RECIPE_DB = {
  '佛跳墙': { '鲍鱼':1,'海参':2,'瑶柱':2,'鸡肉':2,'冬笋':4,'葱':4 },
  '山药芙蓉羹': { '山药':4,'胡萝卜':3,'葱':2,'鸡蛋':8,'芝麻油':1 },
  '鱼腹藏羊肉': { '鲤鱼':3,'羊肉':4,'冬笋':1,'黄瓜':5 },
  '八宝汤圆': { '鲍鱼':1,'黑松露':3,'花生':8,'小麦':6,'姜':3 },
  '酒香烧肉粽': { '米酒':1,'猪肉':1,'鸡蛋':1,'虾仁':1,'糯米':5 },
  '团圆月饼': { '糖':2,'猪肉':2,'鸡蛋':1,'小麦':4,'姜':1 },
  '年年有余': { '鲤鱼':7,'葱':1,'姜':2,'蒜':4,'香菜':4 },
  '金蟾玉鲍': { '鲍鱼':3,'鹊蛋':2,'虾仁':2,'鸡蛋':2,'黄瓜':1,'西蓝花':4 },
  '泉水羊肉': { '胡椒粉':1,'羊肉':3,'葱':1,'姜':2 },
  '茶叶蒸鹿尾': { '铁观音':1,'鹿肉':6,'葱':2,'姜':1 }
};
const ING_DATA = {
  '鲍鱼':{t:'fish',s:'渔场',p:30,ct:'yb',h:48},'海参':{t:'fish',s:'渔场',p:30,ct:'yb',h:48},'瑶柱':{t:'fish',s:'渔场',p:30,ct:'yb',h:48},'鲤鱼':{t:'fish',s:'渔场',p:25,ct:'yb',h:24},'虾仁':{t:'fish',s:'渔场',p:240,ct:'tb',h:12},'金鱼':{t:'fish',s:'渔场',p:0,ct:'none',sell:15,h:8},
  '冬笋':{t:'land',s:'土地',p:650,ct:'tb',sell:65,h:18},'葱':{t:'land',s:'土地',p:300,ct:'tb',h:12},'姜':{t:'land',s:'土地',p:300,ct:'tb',h:12},'山药':{t:'land',s:'土地',p:800,ct:'tb',h:24},'胡萝卜':{t:'land',s:'土地',p:200,ct:'tb',h:8},'黄瓜':{t:'land',s:'土地',p:750,ct:'tb',h:22},'花生':{t:'land',s:'土地',p:200,ct:'tb',h:8},'小麦':{t:'land',s:'土地',p:750,ct:'tb',h:22},'糯米':{t:'land',s:'土地',p:800,ct:'tb',h:24},'西蓝花':{t:'land',s:'土地',p:800,ct:'tb',h:24},'蒜':{t:'land',s:'土地',p:300,ct:'tb',h:12},'香菜':{t:'land',s:'土地',p:450,ct:'tb',h:14},
  '红玫瑰':{t:'land',s:'土地',p:0,ct:'none',sell:10,h:3},'白玫瑰':{t:'land',s:'土地',p:10,ct:'yb',sell:20,h:3},'蓝玫瑰':{t:'land',s:'土地',p:0,ct:'none',sell:100,h:3},
  '黑松露':{t:'limited',s:'限购',p:200,ct:'tb'},'米酒':{t:'limited',s:'限购',p:200,ct:'tb'},'芝麻油':{t:'limited',s:'限购',p:200,ct:'tb'},'糖':{t:'limited',s:'限购',p:200,ct:'tb'},'胡椒粉':{t:'limited',s:'限购',p:200,ct:'tb'},'铁观音':{t:'limited',s:'限购',p:200,ct:'tb'},
  '鸡肉':{t:'limited',s:'打猎/限购',p:30,ct:'tb'},'猪肉':{t:'limited',s:'打猎/限购',p:30,ct:'tb'},'鸡蛋':{t:'limited',s:'购买/限购',p:30,ct:'tb'},'羊肉':{t:'limited',s:'打猎/限购',p:120,ct:'tb'},'鹊蛋':{t:'limited',s:'购买/限购',p:120,ct:'tb'},'鹿肉':{t:'limited',s:'打猎/限购',p:60,ct:'tb'}
};
let state = { recipes: [], stocks: {}, seeds: {} };function init(){loadSettings();for(let k in RECIPE_DB)state.recipes.push({name:k,items:RECIPE_DB[k],qty:0,pinned:false});renderRecipes();renderInventory();}
function saveData(){localStorage.setItem('cookingSettings',JSON.stringify({mode:document.getElementById('time_mode').value,plots:document.getElementById('plots').value,yield:document.getElementById('yieldPerPlot').value,fishPlots:document.getElementById('fishPlots').value,fishYield:document.getElementById('fishYield').value,extraCrop:document.getElementById('extraCrop').value,extraFish:document.getElementById('extraFish').value}));}
function loadSettings(){const s=JSON.parse(localStorage.getItem('cookingSettings'));if(s){document.getElementById('time_mode').value=s.mode||'30';document.getElementById('plots').value=s.plots||'12';document.getElementById('yieldPerPlot').value=s.yield||'15';document.getElementById('fishPlots').value=s.fishPlots||'6';document.getElementById('fishYield').value=s.fishYield||'15';document.getElementById('extraCrop').value=s.extraCrop||'';document.getElementById('extraFish').value=s.extraFish||'';}}function renderRecipes(){state.recipes.sort((a,b)=>(b.pinned===true)-(a.pinned===true));let h='';state.recipes.forEach((r,i)=>{let t=Object.entries(r.items).map(([k,v])=>`<span class="ing-tag">${k}×${v}</span>`).join('');h+=`<div class="recipe-item"><div class="recipe-info"><div class="recipe-title">${r.name}<button class="star-btn ${r.pinned?'active':''}" onclick="togglePin(${i})">⭐</button></div><div>${t}</div></div><div><input type="number" class="qty-input" value="${r.qty||''}" placeholder="0份" oninput="this.value=this.value.replace(/[^0-9]/g,'');state.recipes[${i}].qty=+this.value||0"></div></div>`;});document.getElementById('recipeList').innerHTML=h;}
function togglePin(i){state.recipes[i].pinned=!state.recipes[i].pinned;renderRecipes();}
function renderInventory(){let all=new Set();state.recipes.forEach(r=>Object.keys(r.items).forEach(k=>all.add(k)));let h='';all.forEach(ing=>{let d=ING_DATA[ing]||{};let tc='tag-none',ss=d.s||'无来源';if(d.t==='land')tc='tag-land';else if(d.t==='fish')tc='tag-fish';else if(d.t==='limited')tc='tag-limit';let ip=d.t==='land'||d.t==='fish';let sh=ip?`<input type="number" placeholder="种子" value="${state.seeds[ing]||''}" oninput="this.value=this.value.replace(/[^0-9]/g,'');state.seeds['${ing}']=+this.value||0">`:'';h+=`<div class="inv-item"><div class="inv-name"><span>${ing}</span><span class="tag ${tc}">${ss}</span></div><div class="inv-inputs"><input type="number" placeholder="库存" value="${state.stocks[ing]||''}" oninput="this.value=this.value.replace(/[^0-9]/g,'');state.stocks['${ing}']=+this.value||0">${sh}</div></div>`;});document.getElementById('inventoryList').innerHTML=h;}
function addRecipe(){const n=document.getElementById('newRecipeName').value.trim(),s=document.getElementById('newRecipeItems').value.trim();if(!n||!s){alert('请填写完整');return;}const items={};s.split(/[,，]/).forEach(p=>{const m=p.match(/([^\d]+)(\d+)/);if(m)items[m[1].trim()]=(items[m[1].trim()]||0)+parseInt(m[2]);});if(Object.keys(items).length===0){alert('格式错误');return;}state.recipes.push({name:n,items:items,qty:0,pinned:false});renderRecipes();renderInventory();document.getElementById('addForm').style.display='none';document.getElementById('newRecipeName').value='';document.getElementById('newRecipeItems').value='';}function calculate(){
const mode=+document.getElementById('time_mode').value;const plots=Math.min(+document.getElementById('plots').value||0,12);const ypp=+document.getElementById('yieldPerPlot').value||15;const fPlots=Math.min(+document.getElementById('fishPlots').value||0,6);const fy=+document.getElementById('fishYield').value||15;const eCrop=document.getElementById('extraCrop').value;const eFish=document.getElementById('extraFish').value;
const need={};let has=false;state.recipes.forEach(r=>{if(r.qty>0){has=true;for(let[k,v]of Object.entries(r.items))need[k]=(need[k]||0)+(r.qty*v);}});if(!has){alert("请填写份数");return;}
let uLandH=0,uFishH=0,cTb=0,cYb=0;let rt='<table><thead><tr><th>食材</th><th>需求</th><th>库存</th><th>缺口</th><th>操作</th></tr></thead><tbody>';
Object.keys(need).forEach(ing=>{
let d=need[ing],st=state.stocks[ing]||0,sd=state.seeds[ing]||0,data=ING_DATA[ing]||{};let gap=Math.max(0,d-st);let act='';
if(gap>0&&sd>0)gap=Math.max(0,gap-(data.t==='fish'?fy:ypp)*sd);
if(gap>0){
if(data.t==='land'){let n=Math.ceil(gap/ypp);act=`买${n}颗种子`;uLandH+=n*(data.h||0);if(data.ct==='tb')cTb+=n*data.p;if(data.ct==='yb')cYb+=n*data.p;}
else if(data.t==='fish'){let n=Math.ceil(gap/fy);act=`买${n}个鱼苗`;uFishH+=n*(data.h||0);if(data.ct==='tb')cTb+=n*data.p;if(data.ct==='yb')cYb+=n*data.p;}
else if(data.p){act=`需限购购买${gap}个`;if(data.ct==='tb')cTb+=gap*data.p;if(data.ct==='yb')cYb+=gap*data.p;}
else{act=`<span class="alarm-danger">缺${gap}，无来源</span>`;}}
rt+=`<tr><td>${ing}</td><td>${d}</td><td>${st}</td><td>${gap>0?`<span class="alarm-danger">${gap}</span>`:`<span class="alarm-safe">够</span>`}</td><td>${act}</td></tr>`;});
rt+='</tbody></table>';let rLand=(plots*mode*24)-uLandH;let rFish=(fPlots*mode*24)-uFishH;let eInc='',tInc=0;
if(rLand>0&&eCrop&&ING_DATA[eCrop]&&ING_DATA[eCrop].sell){let c=Math.floor(rLand/(ING_DATA[eCrop].h||3))*ypp;let i=c*ING_DATA[eCrop].sell;tInc+=i;eInc+=`<div>🌷 剩余土地种【${eCrop}】：预计产出 ${c} 个，可卖 <b>${i}</b> 通宝</div>`;}
if(rFish>0&&eFish&&ING_DATA[eFish]&&ING_DATA[eFish].sell){let c=Math.floor(rFish/(ING_DATA[eFish].h||8))*fy;let i=c*ING_DATA[eFish].sell;tInc+=i;eInc+=`<div>🐠 剩余渔场养【${eFish}】：预计产出 ${c} 个，可卖 <b>${i}</b> 通宝</div>`;}
document.getElementById('results').style.display='block';
document.getElementById('resContent').innerHTML=`${rt}<div style="margin-top:15px;font-size:13px;background:#fafafa;padding:15px;border-radius:10px"><div style="font-weight:bold;margin-bottom:5px">⏱️ 时间占用</div><div>土地：${uLandH}/${plots*mode*24}小时 ${rLand<0?'<span class="alarm-danger">(爆满)</span>':''}</div><div>渔场：${uFishH}/${fPlots*mode*24}小时 ${rFish<0?'<span class="alarm-danger">(爆满)</span>':''}</div></div>${eInc?`<div style="margin-top:15px;font-size:13px;background:#ecfdf5;padding:15px;border-radius:10px;color:#065f46"><div style="font-weight:bold;margin-bottom:5px">💰 额外收益</div>${eInc}<div style="margin-top:8px;border-top:1px dashed #a7f3d0;padding-top:8px;font-weight:bold">总计卖钱：${tInc} 通宝</div></div>`:''}`;
document.getElementById('costDetails').innerHTML=`<div>💸 <b>成本预估：</b></div><div>通宝消耗：约 ${cTb}</div><div>元宝消耗：约 ${cYb}</div>`;
}
function copyResult(){let text=document.getElementById('resContent').innerText;if(!text)return;navigator.clipboard.writeText(text).then(()=>{alert('✅ 结果已复制！')}).catch(err=>{alert('复制失败，请手动长按复制')});}
init();
</script>
</body>
</html>
