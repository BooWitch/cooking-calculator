<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍱 魔法做菜计算器</title>
<style>
:root { --primary: #a855f7; --danger: #ef4444; --safe: #10b981; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); color: #333; padding: 20px 10px; line-height: 1.5; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 24px; text-align: center; color: #6c5ce7; margin-bottom: 20px; text-shadow: 2px 2px 0 #fff; }
h2 { font-size: 18px; margin-bottom: 16px; border-left: 4px solid var(--primary); padding-left: 10px; color: #2d3436; }
.card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(108, 92, 231, 0.1); border: 2px solid #fff; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 13px; color: #7c8ba1; font-weight: bold; }
input, select { padding: 10px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; outline: none; background: #fff; font-family: inherit; font-weight: bold; color: #333; }
input:focus, select:focus { border-color: var(--primary); }
button { background: linear-gradient(135deg, #a29bfe, #74b9ff); color: white; border: none; padding: 12px; border-radius: 99px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; box-shadow: 0 4px 15px rgba(116, 185, 255, 0.4); }
button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(116, 185, 255, 0.6); }
.recipe-grid { display: flex; flex-direction: column; gap: 12px; }
.recipe-item { background: #fff; border: 2px solid #f1f2f6; border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 15px; transition: 0.2s; }
.recipe-item:hover { border-color: #e2b0ff; }
.recipe-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.recipe-title { font-weight: bold; font-size: 16px; color: #6c5ce7; display: flex; align-items: center; gap: 8px; }
.recipe-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.ing-tag { background: #f0f4ff; color: #4a5568; font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
.recipe-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.qty-input { width: 80px; text-align: center; border-color: #a29bfe; }
.star-btn { background: transparent; color: #dfe6e9; font-size: 20px; padding: 0; width: auto; margin: 0; box-shadow: none; }
.star-btn.active { color: #fdcb6e; text-shadow: 0 0 5px rgba(253, 203, 110, 0.5); }
.star-btn:hover { background: transparent; transform: scale(1.2); }
.inv-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; }
.inv-name { font-weight: bold; color: #2d3436; flex: 1; }
.inv-inputs { display: flex; gap: 8px; }
.inv-inputs input { width: 80px; text-align: center; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
th { color: #636e72; background: #f1f2f6; }
.alarm-danger { color: #d63031; font-weight: bold; }
.alarm-safe { color: #00b894; font-weight: bold; }
.detail-toggle { cursor: pointer; color: #6c5ce7; font-weight: bold; margin-top: 15px; display: inline-block; text-decoration: underline; }
.detail-box { display: none; margin-top: 10px; background: #fff; padding: 15px; border-radius: 12px; border: 1px dashed #cbd5e1; }
</style>
</head><body>
<div class="container">
  <h1>🍱 魔法做菜计算器</h1>
  
  <div class="card">
    <h2>⚙️ 基础设置</h2>
    <div class="grid">
      <div class="field">
        <label>计算周期</label>
        <select id="time_mode" onchange="saveData()">
          <option value="30">按月计算 (30天)</option>
          <option value="7">按周计算 (7天)</option>
        </select>
      </div>
      <div class="field"><label>农场地块 (上限 20)</label><input type="number" id="plots" value="12" max="20" min="0" onchange="saveData()"></div>
      <div class="field"><label>每块地收获</label><input type="number" id="yieldPerPlot" value="15" min="1" onchange="saveData()"></div>
      <div class="field"><label>渔场块数 (上限 10)</label><input type="number" id="fishPlots" value="4" max="10" min="0" onchange="saveData()"></div>
      <div class="field"><label>每块渔场收获</label><input type="number" id="fishYield" value="15" min="1" onchange="saveData()"></div>
      <div class="field">
        <label>剩余土地种什么卖钱？</label>
        <select id="extraCrop" onchange="saveData()">
          <option value="">不种，休息</option>
          <option value="冬笋">冬笋 (65/个)</option>
          <option value="红玫瑰">红玫瑰 (10/个)</option>
          <option value="白玫瑰">白玫瑰 (20/个)</option>
          <option value="蓝玫瑰">蓝玫瑰 (100/个)</option>
        </select>
      </div>
      <div class="field">
        <label>剩余渔场养什么卖钱？</label>
        <select id="extraFish" onchange="saveData()">
          <option value="">不养，休息</option>
          <option value="金鱼">金鱼 (15/个)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📖 菜谱与目标份数</h2>
    <p style="font-size:12px; color:#7c8ba1; margin-bottom:10px;">点击 ⭐ 可置顶常用菜谱。只填份数，不填默认0份。</p >
    <div class="recipe-grid" id="recipeList"></div>
  </div>

  <div class="card">
    <h2>🧺 食材与库存</h2>
    <p style="font-size:12px; color:#7c8ba1; margin-bottom:10px;">种植的食材才会有种子输入框。</p >
    <div id="inventoryList"></div>
  </div>

  <button onclick="calculate()" style="font-size: 18px; padding: 15px;">✨ 计算缺口与收益</button>
  
  <div class="card" id="results" style="display: none; margin-top: 20px;">
    <h2>📊 计算结果</h2>
    <div id="resContent"></div>
    <div class="detail-toggle" onclick="document.getElementById('costDetails').style.display = document.getElementById('costDetails').style.display === 'block' ? 'none' : 'block';">🔍 点击查看成本与出售详情</div>
    <div id="costDetails" class="detail-box"></div>
  </div>
</div><script>
const RECIPE_DB = {
  '佛跳墙': { '鲍鱼':1,'海参':2,'瑶柱':2,'鸡肉':2,'冬笋':4,'葱':4 },
  '山药芙蓉羹': { '山药':4,'胡萝卜':3,'葱':2,'鸡蛋':8,'芝麻油':1 },
  '鱼腹藏羊肉': { '鲤鱼':3,'羊肉':4,'冬笋':1,'黄瓜':5 },
  '八宝汤圆': { '鲍鱼':1,'黑松露':3,'花生':8,'小麦':6,'姜':3 },
  '酒香烧肉粽': { '米酒':1,'猪肉':1,'鸡蛋':1,'虾仁':1,'糯米':5 },
  '团圆月饼': { '糖':2,'猪肉':2,'鸡蛋':1,'小麦':4,'姜':1 },
  '年年有余': { '鲤鱼':7,'葱':1,'姜':2,'蒜':4,'香菜':4 },
  '金蟾玉鲍': { '鲍鱼':3,'鹊蛋':2,'虾仁':2,'鸡蛋':2,'黄瓜':1,'西蓝花':4 },
  '泉水羊肉': { '胡椒粉':1,'羊肉':3,'葱':1,'姜':2 },
  '茶叶蒸鹿尾': { '铁观音':1,'鹿肉':6,'葱':2,'姜':1 }
};const ING_DATA = {
  '鲍鱼': { type:'fish', price:30, costType:'yb' },
  '海参': { type:'fish', price:30, costType:'yb' },
  '瑶柱': { type:'fish', price:30, costType:'yb' },
  '鲤鱼': { type:'fish', price:25, costType:'yb' },
  '虾仁': { type:'fish', price:240, costType:'tb' },
  '金鱼': { type:'fish', price:0, costType:'none', sell:15, hours:8 },
  '冬笋': { type:'land', price:650, costType:'tb', sell:65, hours:18 },
  '葱': { type:'land', price:300, costType:'tb', hours:12 },
  '姜': { type:'land', price:300, costType:'tb', hours:12 },
  '山药': { type:'land', price:800, costType:'tb', hours:24 },
  '胡萝卜': { type:'land', price:200, costType:'tb', hours:8 },
  '黄瓜': { type:'land', price:750, costType:'tb', hours:22 },
  '花生': { type:'land', price:200, costType:'tb', hours:8 },
  '小麦': { type:'land', price:750, costType:'tb', hours:22 },
  '糯米': { type:'land', price:800, costType:'tb', hours:24 },
  '西蓝花': { type:'land', price:800, costType:'tb', hours:24 },
  '红玫瑰': { type:'land', price:0, costType:'none', sell:10, hours:3 },
  '白玫瑰': { type:'land', price:10, costType:'yb', sell:20, hours:3 },
  '蓝玫瑰': { type:'land', price:0, costType:'none', sell:100, hours:3 },
  '黑松露': { type:'limited', price:200, costType:'tb' },
  '米酒': { type:'limited', price:200, costType:'tb' },
  '芝麻油': { type:'limited', price:200, costType:'tb' },
  '糖': { type:'limited', price:200, costType:'tb' },
  '胡椒粉': { type:'limited', price:200, costType:'tb' },
  '铁观音': { type:'limited', price:200, costType:'tb' }
};

let state = { recipes: [], stocks: {}, seeds: {} };

function init() {
  loadSettings();
  for (let k in RECIPE_DB) {
    state.recipes.push({ name: k, items: RECIPE_DB[k], qty: 0, pinned: false });
  }
  renderRecipes();
  renderInventory();
}function saveData() {
  localStorage.setItem('cookingSettings', JSON.stringify({
    mode: document.getElementById('time_mode').value,
    plots: document.getElementById('plots').value,
    yield: document.getElementById('yieldPerPlot').value,
    fishPlots: document.getElementById('fishPlots').value,
    fishYield: document.getElementById('fishYield').value,
    extraCrop: document.getElementById('extraCrop').value,
    extraFish: document.getElementById('extraFish').value
  }));
}

function loadSettings() {
  const s = JSON.parse(localStorage.getItem('cookingSettings'));
  if(s) {
    document.getElementById('time_mode').value = s.mode || '30';
    document.getElementById('plots').value = s.plots || '12';
    document.getElementById('yieldPerPlot').value = s.yield || '15';
    document.getElementById('fishPlots').value = s.fishPlots || '4';
    document.getElementById('fishYield').value = s.fishYield || '15';
    document.getElementById('extraCrop').value = s.extraCrop || '';
    document.getElementById('extraFish').value = s.extraFish || '';
  }
}

function renderRecipes() {
  state.recipes.sort((a, b) => (b.pinned === true) - (a.pinned === true));
  let html = '';
  state.recipes.forEach((r, i) => {
    let tags = Object.entries(r.items).map(([k,v]) => `<span class="ing-tag">${k}×${v}</span>`).join('');
    html += `<div class="recipe-item"><div class="recipe-info"><div class="recipe-title">${r.name}<button class="star-btn ${r.pinned?'active':''}" onclick="togglePin(${i})">⭐</button></div><div class="recipe-tags">${tags}</div></div><div class="recipe-controls"><input type="number" class="qty-input" min="0" value="${r.qty || ''}" placeholder="0份" oninput="updateQty(${i}, this.value)"></div></div>`;
  });
  document.getElementById('recipeList').innerHTML = html;
}

function togglePin(i) { state.recipes[i].pinned = !state.recipes[i].pinned; renderRecipes(); }
function updateQty(i, val) { state.recipes[i].qty = +val || 0; }

function renderInventory() {
  let allIngs = new Set();
  state.recipes.forEach(r => Object.keys(r.items).forEach(k => allIngs.add(k)));
  let html = '';
  allIngs.forEach(ing => {
    let data = ING_DATA[ing] || {};
    let isPlant = data.type === 'land' || data.type === 'fish';
    let seedHtml = isPlant ? `<input type="number" placeholder="种子" value="${state.seeds[ing] || ''}" oninput="updateSeed('${ing}', this.value)">` : '';
    html += `<div class="inv-item"><div class="inv-name">${ing}</div><div class="inv-inputs"><input type="number" placeholder="库存" value="${state.stocks[ing] || ''}" oninput="updateStock('${ing}', this.value)">${seedHtml}</div></div>`;
  });
  document.getElementById('inventoryList').innerHTML = html;
}

function updateStock(ing, val) { state.stocks[ing] = +val || 0; }
function updateSeed(ing, val) { state.seeds[ing] = +val || 0; }function calculate() {
  const mode = +document.getElementById('time_mode').value;
  const plots = Math.min(+document.getElementById('plots').value || 0, 20);
  const yieldPerPlot = +document.getElementById('yieldPerPlot').value || 15;
  const fishPlots = Math.min(+document.getElementById('fishPlots').value || 0, 10);
  const fishYield = +document.getElementById('fishYield').value || 15;
  const extraCrop = document.getElementById('extraCrop').value;
  const extraFish = document.getElementById('extraFish').value;

  const need = {};
  let hasRecipe = false;

  state.recipes.forEach(r => {
    if (r.qty > 0) {
      hasRecipe = true;
      for (let [k, v] of Object.entries(r.items)) need[k] = (need[k] || 0) + (r.qty * v);
    }
  });

  if (!hasRecipe) { alert("请先填写菜谱份数！"); return; }

  let usedLandHours = 0, usedFishHours = 0, costTb = 0, costYb = 0;
  let resultTable = '<table><thead><tr><th>食材</th><th>需求</th><th>库存</th><th>缺口</th><th>操作</th></tr></thead><tbody>';

  Object.keys(need).forEach(ing => {
    let demand = need[ing], stock = state.stocks[ing] || 0, seeds = state.seeds[ing] || 0, data = ING_DATA[ing] || {};
    let gap = Math.max(0, demand - stock);
    let action = '';
    
    if (gap > 0 && seeds > 0) gap = Math.max(0, gap - (data.type === 'fish' ? fishYield : yieldPerPlot) * seeds);
    if (gap > 0) {
      if (data.type === 'land') {
        let n = Math.ceil(gap / yieldPerPlot); action = `买${n}颗种子种植`;
        usedLandHours += n * (data.hours || 0);
        if (data.costType === 'tb') costTb += n * data.price; if (data.costType === 'yb') costYb += n * data.price;
      } else if (data.type === 'fish') {
        let n = Math.ceil(gap / fishYield); action = `买${n}个鱼苗养殖`;
        usedFishHours += n * (data.hours || 0);
        if (data.costType === 'tb') costTb += n * data.price; if (data.costType === 'yb') costYb += n * data.price;
      } else if (data.price) {
        action = `需限购购买${gap}个`;
        if (data.costType === 'tb') costTb += gap * data.price; if (data.costType === 'yb') costYb += gap * data.price;
      } else { action = `<span class="alarm-danger">缺${gap}，无来源</span>`; }
    }
    resultTable += `<tr><td>${ing}</td><td>${demand}</td><td>${stock}</td><td>${gap > 0 ? `<span class="alarm-danger">${gap}</span>` : `<span class="alarm-safe">够</span>`}</td><td>${action}</td></tr>`;
  });
  resultTable += '</tbody></table>';

  let remainLand = (plots * mode * 24) - usedLandHours;
  let remainFish = (fishPlots * mode * 24) - usedFishHours;
  let extraIncomeHtml = '', totalIncome = 0;

  if (remainLand > 0 && extraCrop && ING_DATA[extraCrop]?.sell) {
    let count = Math.floor(remainLand / (ING_DATA[extraCrop].hours || 3)) * yieldPerPlot;
    let inc = count * ING_DATA[extraCrop].sell; totalIncome += inc;
    extraIncomeHtml += `<div>🌷 剩余土地种【${extraCrop}】：预计产出 ${count} 个，可卖 <b>${inc}</b> 通宝</div>`;
  }
  if (remainFish > 0 && extraFish && ING_DATA[extraFish]?.sell) {
    let count = Math.floor(remainFish / (ING_DATA[extraFish].hours || 8)) * fishYield;
    let inc = count * ING_DATA[extraFish].sell; totalIncome += inc;
    extraIncomeHtml += `<div>🐠 剩余渔场养【${extraFish}】：预计产出 ${count} 个，可卖 <b>${inc}</b> 通宝</div>`;
  }

  document.getElementById('results').style.display = 'block';
  document.getElementById('resContent').innerHTML = `
    ${resultTable}
    <div style="margin-top:15px; font-size:14px; background:#f0f4ff; padding:15px; border-radius:12px;">
      <div style="font-weight:bold; margin-bottom:8px;">⏱️ 时间占用 (上限 ${mode} 天)</div>
      <div>土地时间：${usedLandHours} / ${plots * mode * 24} 小时 ${remainLand < 0 ? '<span class="alarm-danger">(爆满)</span>' : ''}</div>
      <div>渔场时间：${usedFishHours} / ${fishPlots * mode * 24} 小时 ${remainFish < 0 ? '<span class="alarm-danger">(爆满)</span>' : ''}</div>
    </div>
    ${extraIncomeHtml ? `<div style="margin-top:15px; font-size:14px; background:#e8f8f5; padding:15px; border-radius:12px; color:#006266;"><div style="font-weight:bold; margin-bottom:8px;">💰 额外收益(白嫖)</div>${extraIncomeHtml}<div style="margin-top:8px; border-top:1px dashed #b2bec3; padding-top:8px; font-weight:bold; font-size:16px;">总计卖钱：${totalIncome} 通宝</div></div>` : ''}
  `;

  document.getElementById('costDetails').innerHTML = `
    <div>💸 <b>基础种植/购买花费预估：</b></div>
    <div>通宝消耗：约 ${costTb} 通宝</div>
    <div>元宝消耗：约 ${costYb} 元宝</div>
  `;
}

init();
</script>
</body>
</html>
